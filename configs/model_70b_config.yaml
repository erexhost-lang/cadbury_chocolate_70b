# ==============================================================================
# Cadbury-Chocolate 70B: Model Architecture Configuration (Frontier V2)
# ==============================================================================
# Architecture: Sparse Mixture-of-Experts (MoE) + Multi-Head Latent Attention (MLA)
# Parameter calculation:
#   - Layers: 80
#   - Hidden Dim: 8192
#   - Total Model Capacity: ~70.55 Billion parameters
#   - Active Parameters Per Token: ~14.1 Billion (2 shared + 2 routed experts)
#   - Attention: MLA with 512-dim Low-Rank KV compression (90% KV Cache reduction)
#   - Context Window: 131,072 tokens (128k supported via YaRN + MLA compression)
# ==============================================================================

model_type: "cadbury_70b_moe_mla"
architectures:
  - "Cadbury70BMoEModel"

# Model Dimensions
hidden_size: 8192
num_hidden_layers: 80
num_attention_heads: 64
hidden_act: "silu"

# ==============================================================================
# Multi-Head Latent Attention (MLA) — DeepSeek-V3 Style
# ==============================================================================
attention:
  type: "multi_head_latent_attention"
  num_heads: 64
  head_dim: 128
  q_lora_rank: 1536                     # Query low-rank compression
  kv_lora_rank: 512                     # Key-Value low-rank compression (d_c = 512)
  qk_rope_head_dim: 64                  # Decoupled RoPE head dimension (d_R = 64)
  v_head_dim: 128
  kv_cache_compression_ratio: 0.898     # ~90% reduction in KV cache memory vs standard MHA

# Context & Position Embeddings (128k Long Context)
max_position_embeddings: 131072
rope_theta: 500000.0
rope_scaling:
  type: "yarn"
  factor: 16.0
  original_max_position_embeddings: 8192
  finetuned: true

# ==============================================================================
# Fine-Grained Sparse Mixture-of-Experts (MoE)
# ==============================================================================
moe:
  num_routed_experts: 16                # 16 domain-specialized experts
  num_shared_experts: 2                 # 2 always-active shared foundation experts
  top_k: 2                              # Top-2 routed experts activated per token
  expert_intermediate_size: 4096        # Fine-grained SwiGLU expert width
  auxiliary_loss_free_balancing: true   # Dynamic router biases b_i (no quality-degrading aux loss)
  bias_update_rate: 0.001
  active_parameters_per_token: "14.1B"

# Normalization & Regularization
rms_norm_eps: 0.00001
initializer_range: 0.02
tie_word_embeddings: false

# Precision & Hardware Acceleration
torch_dtype: "bfloat16"
use_cache: true
attn_implementation: "flash_attention_2"

# Vocabulary & Core Special Tokens
vocab_size: 128270
bos_token_id: 128000
eos_token_id: 128001
pad_token_id: 128002

# Fill-In-The-Middle (FIM) Tokens
fim_prefix_id: 128003
fim_middle_id: 128004
fim_suffix_id: 128005

# Chain-of-Thought (CoT) & Agentic Tool Tokens
think_start_id: 128006
think_end_id: 128007
tool_call_start_id: 128008
tool_call_end_id: 128009
tool_output_start_id: 128010
tool_output_end_id: 128011
hypothesis_start_id: 128012
hypothesis_end_id: 128013

# ==============================================================================
# Adaptive Compute & Surgical RL Parameters
# ==============================================================================
adaptive_compute:
  mtp_num_future_tokens: 2
  mtp_loss_weight: 0.3
  entropy_early_exit_threshold: 0.45
  entropy_window_size: 15

rl_efficiency_penalties:
  tool_step_penalty: 0.02
  unused_file_read_penalty: 0.15
  thinking_token_penalty_weight: 0.0005
  optimal_think_budget: 150
  anti_hacking_penalty: 3.0
