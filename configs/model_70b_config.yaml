# ==============================================================================
# Cadbury-Chocolate 70B: Model Architecture Configuration
# ==============================================================================
# Architecture modeled after modern 70B open-weights state-of-the-art (Llama-3-70B class)
# Parameter calculation:
#   - Layers: 80
#   - Hidden Dim: 8192
#   - Intermediate Dim (SwiGLU): 28672 (~3.5x hidden_size)
#   - Attention: Grouped Query Attention (GQA) with 64 Q heads and 8 KV heads
#   - Context Window: 32,768 tokens (extended from 8k via YaRN RoPE Scaling)
#   - Active Parameters: ~70.55 Billion
# ==============================================================================

model_type: "cadbury_70b"
architectures:
  - "CadburyForCausalLM"

# Model Dimensions
hidden_size: 8192
intermediate_size: 28672
num_hidden_layers: 80
num_attention_heads: 64
num_key_value_heads: 8            # Grouped Query Attention (8:1 ratio) saves KV cache VRAM
hidden_act: "silu"               # SwiGLU non-linear activation

# Context & Position Embeddings (Extended to 32k via YaRN)
max_position_embeddings: 32768
rope_theta: 500000.0             # High base frequency for long-context stability
rope_scaling:
  type: "yarn"                   # Yet another RoPE extensioN method (YaRN)
  factor: 4.0                    # 4x scaling (8192 * 4 = 32,768 tokens)
  original_max_position_embeddings: 8192
  finetuned: true

# Normalization & Regularization
rms_norm_eps: 0.00001
initializer_range: 0.02
tie_word_embeddings: false        # Untied lm_head for improved code token precision

# Precision & Hardware Acceleration
torch_dtype: "bfloat16"
use_cache: true
attn_implementation: "flash_attention_2"  # Fused kernel with O(N) memory scaling

# Vocabulary & Core Special Tokens
vocab_size: 128268
bos_token_id: 128000
eos_token_id: 128001
pad_token_id: 128002

# Fill-In-The-Middle (FIM) Tokens
fim_prefix_id: 128003
fim_middle_id: 128004
fim_suffix_id: 128005

# Chain-of-Thought (CoT) & Agentic Tool Tokens
think_start_id: 128006
think_end_id: 128007
tool_call_start_id: 128008
tool_call_end_id: 128009
tool_output_start_id: 128010
tool_output_end_id: 128011
