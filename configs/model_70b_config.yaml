# ==============================================================================
# Cadbury-Chocolate 70B: Model Architecture Configuration
# ==============================================================================
# Architecture modeled after modern 70B open-weights state-of-the-art (Llama-3-70B class)
# Parameter calculation:
#   - Layers: 80
#   - Hidden Dim: 8192
#   - Intermediate Dim (SwiGLU): 28672 (~3.5x hidden_size)
#   - Attention: Grouped Query Attention (GQA) with 64 Q heads and 8 KV heads
#   - Vocab: 128,256 tokens (covers multilingual syntax, whitespace, and FIM tags)
#   - Total Active Parameters: ~70.55 Billion
# ==============================================================================

model_type: "cadbury_70b"
architectures:
  - "CadburyForCausalLM"

# Model Dimensions
hidden_size: 8192
intermediate_size: 28672
num_hidden_layers: 80
num_attention_heads: 64
num_key_value_heads: 8            # Grouped Query Attention (8:1 ratio) to save KV cache VRAM
hidden_act: "silu"               # SwiGLU non-linear activation

# Context & Position Embeddings
max_position_embeddings: 8192     # 8k token context window (extensible to 32k via YaRN/RoPE scaling)
rope_theta: 500000.0             # High base frequency for long-context stability
rope_scaling: null

# Normalization & Regularization
rms_norm_eps: 0.00001
initializer_range: 0.02
tie_word_embeddings: false        # Untied lm_head for improved code token precision

# Precision & Acceleration
torch_dtype: "bfloat16"
use_cache: true
attn_implementation: "flash_attention_2"  # Hardware-accelerated memory-efficient attention kernel

# Vocabulary
vocab_size: 128256
bos_token_id: 128000
eos_token_id: 128001
pad_token_id: 128002

# Fill-In-The-Middle (FIM) Special Token IDs
fim_prefix_id: 128003
fim_middle_id: 128004
fim_suffix_id: 128005
